<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found</title>
<meta name="theme-color" content="#050607">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050607;
    --grid: rgba(255, 255, 255, 0.05);
    --text: #ece6da;
    --muted: rgba(236, 230, 218, 0.34);
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Bricolage Grotesque", -apple-system, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  [hidden] { display: none !important; }

  .grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 76px 76px;
    background-position: center top;
  }
  .scene {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0 16px 13vh;
    text-align: center;
    pointer-events: none;
  }
  .scene .time { font: 12px/1 var(--mono); letter-spacing: 0.2em; color: rgba(236, 230, 218, 0.55); margin-bottom: 22px; }
  .scene h1 {
    font-family: "Funnel Display", "Bricolage Grotesque", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    font-size: clamp(40px, 7vw, 96px);
    letter-spacing: -0.035em;
    line-height: 0.98;
  }
  .scene h1 em { font-style: normal; color: #f76d01; }
  .scene p { margin-top: 22px; font: 500 17px/1.5 "Bricolage Grotesque", -apple-system, sans-serif; color: rgba(236, 230, 218, 0.6); max-width: 56ch; }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .hud { position: fixed; inset: 0; pointer-events: none; font: 12px/1 var(--mono); color: var(--muted); }
  .hud > * { position: absolute; pointer-events: auto; }
  .tl { top: 20px; left: 20px; letter-spacing: 0.04em; line-height: 1.7; }
  .tl b { font-weight: 400; color: rgba(236, 230, 218, 0.7); }
  .tr {
    top: 14px; right: 14px;
    background: none; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 999px;
    color: var(--muted); font: inherit; padding: 7px 12px; cursor: pointer;
  }
  .tr:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.22); }
  .hint { left: 0; right: 0; bottom: 22px; text-align: center; pointer-events: none; padding: 0 16px; }
  .reset {
    left: 50%; bottom: 52px; transform: translateX(-50%);
    background: #f76d01; color: #17121d; border: 0; border-radius: 999px;
    font: 500 13px/1 var(--mono); padding: 11px 18px; cursor: pointer;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    animation: rise 0.4s cubic-bezier(.2, .9, .3, 1.2);
  }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 12px); } }

  .switch {
    right: max(24px, 8vw); top: 50%; transform: translateY(-50%);
    width: 74px; height: 120px;
    border-radius: 11px;
    background: linear-gradient(160deg, #26282b, #151618 60%, #101112);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.09),
      inset 0 -1px 0 rgba(0, 0, 0, 0.6),
      0 1px 0 rgba(255, 255, 255, 0.03),
      0 14px 30px rgba(0, 0, 0, 0.7);
    cursor: pointer;
    outline: none;
  }
  .switch:focus-visible { box-shadow: 0 0 0 2px rgba(247, 109, 1, 0.7), 0 14px 30px rgba(0, 0, 0, 0.7); }
  .switch.knock { animation: knock 0.32s cubic-bezier(.3, .7, .4, 1); }
  @keyframes knock {
    0% { transform: translateY(-50%) translate(var(--kx, 0), var(--ky, 0)) rotate(var(--kr, 0deg)); }
    100% { transform: translateY(-50%); }
  }
  .screw {
    position: absolute; left: 50%; width: 7px; height: 7px; margin-left: -3.5px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #6b6d70, #2a2b2d 70%);
  }
  .screw::after { content: ""; position: absolute; left: 1px; right: 1px; top: 3px; height: 1px; background: rgba(0, 0, 0, 0.7); transform: rotate(35deg); }
  .screw.t { top: 9px; }
  .screw.b { bottom: 9px; }
  .slot {
    position: absolute; left: 50%; top: 50%; width: 26px; height: 50px; margin: -25px 0 0 -13px;
    border-radius: 5px;
    background: linear-gradient(#060607, #0d0e0f);
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.06);
    perspective: 120px;
  }
  .lever {
    position: absolute; left: 3px; right: 3px; top: 3px; bottom: 3px; border-radius: 3px;
    transition: transform 0.14s cubic-bezier(.3, 1.6, .5, 1);
    transform-origin: 50% 50%;
    transform: rotateX(-26deg);
    background: linear-gradient(#9d9b97 0%, #d8d4cc 38%, #8c8984 52%, #54524f 100%);
    box-shadow: 0 5px 6px rgba(0, 0, 0, 0.6);
  }
  .switch[aria-checked="false"] .lever {
    transform: rotateX(26deg);
    background: linear-gradient(#4d4b48 0%, #85827d 48%, #d0ccc4 64%, #97948f 100%);
    box-shadow: 0 -5px 6px rgba(0, 0, 0, 0.6);
  }
  .engrave { position: absolute; left: 0; right: 0; text-align: center; font: 8px/1 var(--mono); letter-spacing: 0.18em; color: rgba(255, 255, 255, 0.22); }
  .engrave.on { top: 20px; }
  .engrave.off { bottom: 20px; }
  .pilot {
    position: absolute; right: 9px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%;
    background: #3a2a1a; transition: background 0.2s, box-shadow 0.2s;
  }
  .switch[aria-checked="true"] .pilot { background: #f76d01; box-shadow: 0 0 6px 1px rgba(247, 109, 1, 0.85); }

  .mob { display: none; }
  @media (max-width: 640px) {
    .scene { padding-bottom: 168px; }
    .scene .time { font-size: 11px; margin-bottom: 14px; }
    .scene h1 { font-size: clamp(34px, 11vw, 44px); }
    .scene p { margin-top: 14px; font-size: 15px; max-width: 30ch; }
    .desk, .hint { display: none; }
    .mob { display: inline; }
    .tl { top: 14px; left: 14px; font-size: 11px; }
    .tr { top: 10px; right: 10px; font-size: 11px; padding: 6px 10px; }
    .switch { right: 14px; top: 36%; scale: 0.8; transform-origin: right center; }
  }
  @media (max-width: 640px) and (max-height: 620px) {
    .scene { padding-bottom: 158px; }
    .scene .time { display: none; }
    .scene h1 { font-size: 32px; }
    .scene p { margin-top: 10px; font-size: 14px; }
    .switch { top: 30%; }
  }
  @media (max-height: 500px) and (orientation: landscape) {
    .scene { padding-bottom: 24px; }
    .scene .time { margin-bottom: 10px; }
    .scene h1 { font-size: 34px; }
    .scene h1 br { display: none; }
    .scene p { margin-top: 10px; font-size: 14px; max-width: 44ch; }
    .desk, .hint { display: none; }
    .mob { display: inline; }
    .switch { top: 50%; scale: 0.8; transform-origin: right center; }
  }
</style>
</head>
<body>
<div class="grid"></div>
<main class="scene">
  <span class="time">404</span>
  <h1>This page <br>isn't <em>here</em>.</h1>
  <p><span class="desk">That link doesn't go anywhere.<br>The lamp is still on, if you want something to do.</span><span class="mob">Wrong link. The lamp is still here. Flip the switch, or pull the slingshot.</span></p>
</main>
<canvas id="c"></canvas>
<div class="hud">
  <div class="tl">404 · page not found · <b id="state">on</b><br>shots <b id="shots">0</b> · bulbs <b id="bulbs">0</b></div>
  <button id="sound" class="tr">sound: on</button>
  <div id="switch" class="switch" role="switch" aria-checked="true" aria-label="Light switch" tabindex="0">
    <span class="screw t"></span>
    <span class="engrave on">ON</span>
    <div class="slot"><div class="lever"></div></div>
    <span class="pilot"></span>
    <span class="engrave off">OFF</span>
    <span class="screw b"></span>
  </div>
  <button id="reset" class="reset" hidden>replace bulb</button>
  <div class="hint">wrong link · flip the switch · pull the pebble back and let go</div>
</div>
<script src="/lamp.js"></script>
</body>
</html>
